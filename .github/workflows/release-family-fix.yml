name: Verify and publish family reply fix 3.5.207
on:
  push:
    branches: [main]
    paths: ['update/live/versions/3.5.207/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-3.5.207
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LuaJIT test runtime
        run: python -m pip install lupa==2.8
      - name: Test family requests and update distribution
        run: |
          python tests/test_family_questions.py
          python tools/verify_distribution.py
      - name: Download verified base archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v3.5.206 --pattern X-Tools.zip --dir base
      - name: Build and verify full archive
        run: python tools/package_family_fix.py base/X-Tools.zip dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.5.207 >/dev/null 2>&1; then
            echo 'Release v3.5.207 already exists; refusing to replace it.'
            exit 1
          fi
          gh release create v3.5.207 dist/X-Tools.zip dist/X-TOOL.lua --target "$GITHUB_SHA" --title 'X-Tools 3.5.207 — исправление ответов о семье' --notes-file release-notes.md --prerelease
