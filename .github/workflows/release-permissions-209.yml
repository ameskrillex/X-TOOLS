name: Verify and publish command permissions 3.5.209
on:
  push:
    branches: [main]
    paths: ['update/live/versions/3.5.209/manifest.json']
permissions:
  contents: write
concurrency:
  group: release-3.5.209
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: |
          python tests/test_visual_layout.py
          python tests/test_family_questions.py
          python tools/verify_distribution.py
      - name: Download verified base archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v3.5.208 --pattern X-Tools.zip --dir base
      - name: Build and verify full archive
        run: python tools/package_family_fix.py base/X-Tools.zip dist --base-version 3.5.208 --version 3.5.209 --base-sha256 c546fd090f8f55a114282241c157fde5246e230b8ccca284c91b37e10dae3b2e
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.5.209 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace it.'
            exit 1
          fi
          gh release create v3.5.209 dist/X-Tools.zip dist/X-TOOL.lua --target "$GITHUB_SHA" --title 'X-Tools 3.5.209 — уровни доступа к командам' --notes-file release-notes.md --prerelease
