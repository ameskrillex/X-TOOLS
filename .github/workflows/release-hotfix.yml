name: Verify published distribution
on:
  push:
    branches: [main]
    paths: ['update/manifest.json', 'X-TOOL.lua']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: python tools/verify_distribution.py
